# Play application configuration

play.http.secret.key = "${?APPLICATION_SECRET}"
play.http.secret.key = "changeme-dev-only-not-for-production"

slick.dbs.default {
  profile = "slick.jdbc.H2Profile$"
  db {
    driver = "org.h2.Driver"
    url = "jdbc:h2:mem:play;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH"
    connectionPool = disabled
    keepAliveConnection = true
  }
}

play.filters.disabled += play.filters.csrf.CSRFFilter
play.filters.disabled += play.filters.headers.SecurityHeadersFilter

play.filters.cors {
  allowedOrigins = null
  allowedHttpMethods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS", "HEAD"]
  allowedHttpHeaders = null
  preflightMaxAge = 3 days
}
play.filters.enabled += play.filters.cors.CORSFilter

play.evolutions.autoApply=true
